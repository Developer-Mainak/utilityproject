          {
            "@type": "Question",
            "name": "How do I encode a PDF to Base64 online?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Open NotJustPDF and click 'Base64' in the sidebar. Switch to the 'File to Base64' tab, then drag and drop or select your PDF file. The tool instantly converts the PDF to a Base64 Data URI and raw Base64 string in your browser — no upload required."

            }
          },
          {
            "@type": "Question",
            "name": "What file types can I convert to Base64?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "NotJustPDF supports any file type for Base64 conversion — images (PNG, JPG, WEBP, GIF), PDFs, SVGs, fonts (TTF, WOFF), audio files, and arbitrary binary files. The output is a full Data URI ready to embed in HTML or CSS, plus a raw Base64 string."
            }
          },

            "@type": "Question",
            "name": "Can I use NotJustPDF to decode a Base64 string back to a file?",

            }
          },
          {
            "@type": "Question",
            "name": "Does NotJustPDF work offline?",
            "acceptedAnswer": {
